# Mirror-only workflow: lives in scripts/public-mirrors/overlays/create-secureflows-app/ in the
# private secureFlows monorepo (this file has no monorepo-side equivalent — the monorepo has its
# own CI). Edit it there; scripts/sync-public-mirrors.mjs copies it into this repo on every sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache: npm — this package has zero dependencies, so there's no package-lock.json
          # for actions/setup-node to key the cache on (and npm ci would fail for the same reason).
      - run: npm install
      - run: npm test
